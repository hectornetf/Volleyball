name: Build Mobile APK + Publish OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-update.yml'
  workflow_dispatch:

concurrency:
  group: mobile-preview-build
  cancel-in-progress: true

jobs:
  publish:
    name: Build APK + Publish Expo update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build APK (Android preview)
        run: npx --yes eas-cli@27.1.0 build --platform android --profile preview --message "$COMMIT_MESSAGE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual preview build' }}

      - name: Publish OTA update
        run: npx --yes eas-cli@27.1.0 update --channel preview --environment preview --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}