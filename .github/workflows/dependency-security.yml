name: Dependency security and validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Audit and validate web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  mobile:
    name: Audit and validate mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: mobile

      - name: Lint
        run: npm run lint
        working-directory: mobile

      - name: Check Expo compatibility
        run: npx expo install --check
        working-directory: mobile
