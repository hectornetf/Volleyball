name: Dependency security and validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/package.json"
      - "web/package-lock.json"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/patches/**"
      - "mobile/tests/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Audit and validate web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  mobile:
    name: Audit and validate mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: Test dependency security patch
        run: npm run test:security
        working-directory: mobile

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: mobile

      - name: Lint
        run: npm run lint
        working-directory: mobile

      - name: Check Expo compatibility
        run: npx expo install --check
        working-directory: mobile

  automerge:
    name: Auto-merge validated Dependabot updates
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.title, 'minor-and-patch group')
    needs:
      - web
      - mobile
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
